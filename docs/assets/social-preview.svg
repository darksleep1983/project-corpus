<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Project Corpus social preview</title>
  <desc id="description">Persistent project state and authority for AI agents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#16253a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#050a12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <rect x="48" y="48" width="1184" height="544" rx="28" fill="#142136" stroke="#30435d" stroke-width="2"/>
  <rect x="96" y="98" width="12" height="106" rx="6" fill="#66d9c2"/>
  <text x="136" y="145" fill="#f7fafc" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="2">PROJECT CORPUS</text>
  <text x="136" y="193" fill="#b9c8db" font-family="Segoe UI, Arial, sans-serif" font-size="28">Persistent project state and authority for AI agents</text>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="112" y="304" width="250" height="146" rx="18" fill="#1c2d45" stroke="#3f5878" stroke-width="2"/>
    <text x="237" y="365" fill="#f7fafc" text-anchor="middle" font-size="28" font-weight="600">AI Session</text>
    <text x="237" y="403" fill="#aebfd4" text-anchor="middle" font-size="22">clean context</text>

    <path d="M395 377 H486" stroke="#66d9c2" stroke-width="6" stroke-linecap="round"/>
    <path d="M470 361 L494 377 L470 393" fill="none" stroke="#66d9c2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="510" y="278" width="288" height="198" rx="20" fill="#173c4a" stroke="#66d9c2" stroke-width="3"/>
    <text x="654" y="342" fill="#f7fafc" text-anchor="middle" font-size="29" font-weight="700">Project Corpus</text>
    <text x="654" y="385" fill="#c9f5e9" text-anchor="middle" font-size="20">PROJECT.md · STATUS.md</text>
    <text x="654" y="418" fill="#c9f5e9" text-anchor="middle" font-size="20">Tasks · Reports · Policy</text>

    <path d="M831 377 H922" stroke="#66d9c2" stroke-width="6" stroke-linecap="round"/>
    <path d="M906 361 L930 377 L906 393" fill="none" stroke="#66d9c2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="954" y="304" width="214" height="146" rx="18" fill="#1c2d45" stroke="#3f5878" stroke-width="2"/>
    <text x="1061" y="365" fill="#f7fafc" text-anchor="middle" font-size="28" font-weight="600">Next Session</text>
    <text x="1061" y="403" fill="#aebfd4" text-anchor="middle" font-size="22">exact next action</text>
  </g>

  <text x="96" y="546" fill="#8fa4be" font-family="Segoe UI, Arial, sans-serif" font-size="24">Markdown-first Protocol + optional enforcement Runtime</text>
</svg>
