[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-corpus"
version = "2.0.0.dev0"
description = "Optional reference Runtime for Project Corpus Protocol"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
