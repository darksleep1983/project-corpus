[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-corpus-mcp"
version = "0.1.0"
description = "Local project memory and auditable MCP file workflow for long-running AI projects"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Project Corpus contributors"}]
dependencies = ["mcp>=1.28,<2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
project-corpus-mcp = "project_corpus_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
